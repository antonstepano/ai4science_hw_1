ontology: LunarDustResearchContext
goal: >
  Связать научные источники, параметры, наблюдения, условия, процессы, материалы,
  модели, эксперименты и защитные решения так, чтобы находить входы модели,
  происхождение утверждений, противоречия и DATA GAP.
competency_questions:
  - Какие источники поддерживают конкретный параметр блока модели и при каких условиях?
  - Какие параметры нужны для перехода от источника пыли к осаждению на конкретной поверхности?
  - Какие наблюдения противоречат друг другу и объясняется ли это размером, материалом или средой?
  - Какие DATA GAP блокируют расчёт и какой эксперимент может их закрыть?
  - Какие защитные решения уменьшают какой механизм риска и какими источниками это подтверждено?
classes:
  Источник: {parent: null, definition: научная публикация, отчёт, каталог или dataset}
  Утверждение: {parent: null, definition: проверяемое научное утверждение}
  Параметр: {parent: null, definition: вход или выход физической/инженерной модели}
  Наблюдение: {parent: null, definition: конкретное значение, диапазон, распределение или закон}
  Материал: {parent: null, definition: пыль, минерал, симулянт, покрытие или материал станции}
  Среда: {parent: null, definition: набор граничных условий и сценарий}
  Процесс: {parent: null, definition: физический механизм пылеобразования, переноса, контакта или деградации}
  БлокМодели: {parent: null, definition: блок 0–8 или инженерный блок}
  Эксперимент: {parent: null, definition: лабораторная или летная проверка}
  ЗащитноеРешение: {parent: null, definition: активная, пассивная или эксплуатационная защита}
  ПробелДанных: {parent: null, definition: критически недостающие или противоречивые данные}
properties:
  сообщает: {domain: Источник, range: Наблюдение}
  поддерживает: {domain: Источник, range: Утверждение}
  измеряет: {domain: Наблюдение, range: Параметр}
  приУсловиях: {domain: [Наблюдение, Эксперимент], range: Среда}
  дляМатериала: {domain: [Наблюдение, Эксперимент], range: Материал}
  относитсяКБлоку: {domain: [Параметр, Процесс, Наблюдение], range: БлокМодели}
  участвуетВ: {domain: Материал, range: Процесс}
  проверяет: {domain: Эксперимент, range: [Утверждение, Параметр, Процесс]}
  снижает: {domain: ЗащитноеРешение, range: Процесс}
  требует: {domain: ПробелДанных, range: [Параметр, Эксперимент]}
  противоречит: {domain: Наблюдение, range: Наблюдение, characteristics: [symmetric]}
attributes:
  evidence_type: {domain: Наблюдение, values: [MEASURED, DERIVED, SIMULATED, LITERATURE_ESTIMATE, ASSUMED, EXPERT_JUDGEMENT]}
  verification_status: {domain: Источник, values: [verified_metadata, verified_oa, needs_review]}
